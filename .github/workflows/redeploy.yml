name: Redeploy
run-name: "Redeploy ${{ inputs.groups || 'every group' }} &rarr; ${{ inputs.environment }}"

# Deploys the whole site by dispatching the Webgentics workflow once per
# group instead of once per segment: twenty runs for all 476 segments.
# This is the sweep for a change no translation writes - a theme edit, an
# i18n string, a config change. The hourly translate run already deploys
# the segments its own translations touch, so nothing here is scheduled.
#
# Group sizes are what the list is arranged around, counted against every
# english page existing in every language, since translate.yml is filling
# that in continuously. Each conversion platform is heavy enough to take
# two runs, split by language into halves of ten and nine; viewer takes
# one; and everything else - the front pages and sitemaps, parser,
# metadata and the twelve products with no format pages - is one run
# between them. The list below is the whole of it: a language or a
# product added to the site is added here too.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build and deploy environment
        type: environment
        default: production
        required: true
      groups:
        description: "Space-separated group names, or empty for every group"
        required: false
        default: ""
        type: string
      sha_ref:
        description: Branch, tag or commit SHA of the content repository
        required: false
        default: master
        type: string

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch one deploy per group
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.groups }}
        run: |
          set -euo pipefail
          failed=0
          {
            echo "## Redeploy &middot; ${{ inputs.environment }}"
            echo
            echo "| Group | Segments | Dispatch |"
            echo "| :--- | ---: | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while read -r group segments; do
            [ -n "$group" ] || continue
            case "${ONLY:-}" in "") ;; *" $group "*|"$group "*|*" $group"|"$group") ;; *) continue ;; esac

            op="redeploy-${group}-${GITHUB_RUN_NUMBER}"
            ok=""
            for attempt in 1 2 3; do
              code=$(curl -s -o "$RUNNER_TEMP/resp.txt" -w '%{http_code}' --max-time 30 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/webgentics.yml/dispatches" \
                -d "$(jq -nc --arg op "$op" --arg seg "$segments" \
                        --arg env "${{ inputs.environment }}" --arg ref "${{ inputs.sha_ref }}" \
                        '{ref: "master", inputs: {operation_id: $op, operation_kind: "connector.deploy",
                           sha_ref: $ref, website_id: "products.groupdocs.cloud",
                           environment: $env, segments: $seg}}')" \
                || echo 000)
              [ "$code" = "204" ] && { ok=yes; break; }
              sleep $(( attempt * 5 ))
            done

            n=$(( $(echo "$segments" | tr -cd ',' | wc -c) + 1 ))
            if [ -n "$ok" ]; then
              echo "| \`$group\` | $n | queued as \`$op\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$group\` | $n | **failed ($code)** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::dispatch failed for $group (HTTP $code): $(head -c 200 "$RUNNER_TEMP/resp.txt")"
              failed=$(( failed + 1 ))
            fi
          done <<'GROUPS'
