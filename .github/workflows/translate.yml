name: Translate
run-name: "Translate ${{ inputs.products || 'every product' }} → ${{ inputs.languages || 'every language' }}"

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      products:
        description: "Comma-separated products or subtrees, or empty for the demand ladder"
        required: false
        default: ""
        type: string
      languages:
        description: "Comma-separated target language codes, or empty for every site language"
        required: false
        default: ""
        type: string
      max-files:
        description: "Files one product may process (skips count toward it)"
        required: false
        default: "100000"
        type: string
      budget-minutes:
        description: "Minutes of translating before a slot stops itself and pushes"
        required: false
        default: "42"
        type: string
      environment:
        description: "Reporting environment (test rows are auto-purged nightly)"
        required: false
        default: "production"
        type: string

# One run at a time: an hourly schedule against a run that may spend its whole
# budget would otherwise overlap itself.
concurrency:
  group: translate
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  # What a run will translate, decided once so the slots below cannot each
  # reach a different answer, and so the deploy at the end has one pre-run
  # commit to diff against.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slots: ${{ steps.slots.outputs.list }}
      languages: ${{ steps.languages.outputs.list }}
      base: ${{ steps.base.outputs.sha }}

    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          token: ${{ secrets.REPO_TOKEN }}
          path: site
          # Only the tree and the config are read here; history is what the
          # translating jobs need.
          fetch-depth: 1

      - name: Record the pre-run head
        id: base
        working-directory: site
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          extended: true

      # The default target list is the site's own roster: the effective Hugo
      # config's languages minus the default content language, so a language
      # added to the site starts translating without a workflow edit.
      - name: Resolve the target languages
        id: languages
        env:
          REQUESTED: ${{ inputs.languages || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            echo "list=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hugo config --source site --format json > "$RUNNER_TEMP/effective.json"
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          cfg = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "effective.json")))
          langs = set(cfg["languages"]) - {cfg["defaultcontentlanguage"]}
          # Impressions per locale, Search Console 2026-05-23..2026-08-18.
          # The walk is page-major, so the language list is a multiplier on
          # every page rather than a prefix a budget truncates: all of it is
          # paid for each page reached. These nine carry 95.2% of the locale
          # demand between them, and the nine below them - zh he ar vi ko el
          # tr th da, 4.8% - would double what a page costs to reach. They are
          # not dropped, they are queued: name them in `languages` to run them,
          # and move one up here when its demand earns the multiplier.
          ranked = "ru es pt id fr it fa ja de".split()
          order = [l for l in ranked if l in langs] or sorted(langs)
          print("list=" + ",".join(order))
          PY

      # Four slots a run, not a sliver of every product: a share shorter than
      # the pages it opens ends with whatever was in flight abandoned, and the
      # run spends itself re-walking skip prefixes.
      #
      # What fills the four follows the demand, and demand inside a product is
      # as lopsided as demand between products. Impressions per subtree,
      # Search Console 2026-05-23..2026-08-18: viewer/android alone is 26% of
      # everything the site is shown for, more than the whole of conversion's
      # largest platform, so it holds a slot of its own in every run. Two
      # slots rotate by run number through the platforms of conversion and
      # viewer, the two products that carry 92% of impressions between them,
      # and the fourth rotates through every other product. Three quarters of
      # a run therefore lands on that 92%, against half of it when the slots
      # were whole products.
      #
      # Nothing starves: each rotation advances a slot per run, so a platform
      # comes up within a day and a tail product within a fortnight.
      - name: Choose the slots
        id: slots
        env:
          PRODUCTS_INPUT: ${{ inputs.products || '' }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, sys

          ROOT = pathlib.Path("site/content/english")
          RUN = int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          ANCHOR = "viewer/android"

          def ladder(parent, ranked, skip=()):
              """The children of `parent` in demand order, then the rest, so a
              folder the site adds still comes up for its turn."""
              root = ROOT / parent
              if not root.is_dir():
                  return []
              here = sorted(d.name for d in root.iterdir() if d.is_dir())
              here = [n for n in here if n not in skip]
              return [n for n in ranked if n in here] + [n for n in here if n not in ranked]

          def turn(names):
              return [names[RUN % len(names)]] if names else []

          requested = [p.strip() for p in os.environ["PRODUCTS_INPUT"].split(",") if p.strip()]
          if requested:
              slots = requested
          else:
              conversion = ladder("conversion", "net curl php android python go ruby java nodejs".split())
              viewer = ladder("viewer", "net php curl python java nodejs go".split(), skip={"android"})
              rest = ladder(".", "parser metadata translation signature editor merger rewriter"
                                 " comparison assembly annotation watermark classification total".split(),
                            skip={"conversion", "viewer"})
              slots = [ANCHOR]
              slots += [f"conversion/{n}" for n in turn(conversion)]
              slots += [f"viewer/{n}" for n in turn(viewer)]
              slots += turn(rest)

          slots = [s for s in slots if (ROOT / s).is_dir()]
          # EXPERIMENT: one slot, so one translagent process. The selection
          # above is left intact - it is truncated, not replaced - so ending
          # the experiment is deleting this line. ANCHOR sorts first, so the
          # slot is viewer/android: the subtree that carries the most demand
          # and the one whose drain ran longest in run 156, which makes it the
          # comparable baseline.
          slots = slots[:1]
          if not slots:
              raise SystemExit("::error::no slot to translate: none of the named paths exists")
          print("slots: " + " ".join(slots), file=sys.stderr)
          print("list=" + json.dumps(slots))
          PY

  # One job per slot, each with the whole budget. The slots used to share one
  # job and divide the wall clock between them; run side by side they each get
  # all of it, which is the throughput this deployment is short of.
  #
  # Four processes against one endpoint need nothing between them. Each reads
  # the queue all of them are building as its own latency, and independent
  # AIMD controllers on a shared congestion signal converge to an equal share
  # of the bottleneck, so the fleet saturates without any one of them choking
  # it; a burst of refusals costs each of them one halving and a cool-down.
  # The token bucket is not what governs this - one process measured 44 pages
  # an hour at some 20 requests a minute against a 1200 ceiling, so latency is
  # the binding constraint and the controller is what reads it. max-parallel
  # bounds what a hand-dispatched list of twenty products can aim at the
  # endpoint at once.
  translate:
    name: ${{ matrix.slot }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: ${{ fromJSON(needs.plan.outputs.slots) }}

    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          token: ${{ secrets.REPO_TOKEN }}
          path: site
          # Full history: translagent judges freshness by last-commit times,
          # and pairs a translation with the English of the commit that wrote
          # it to decide what it can keep.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Pull translagent
        run: docker pull ghcr.io/agentization/translagent:latest

      - name: Configure git identity
        working-directory: site
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      # Docker rejects a slash in a container name and an artifact rejects one
      # in its own, so the slot gets a flat spelling once, here.
      - name: Name this slot
        env:
          SLOT: ${{ matrix.slot }}
        run: echo "SLOT_SLUG=$(echo "$SLOT" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Translate
        run: |
          set -u
          STOP=$(( $(date +%s) + BUDGET_MINUTES * 60 ))

          if [ ! -d "site/content/english/$SLOT" ]; then
            echo "::error::no such product: $SLOT"
            exit 1
          fi

          # The product a report is filed under is the top of the path, which
          # is what a slot naming a subtree still shares with its siblings.
          PRODUCT_OFFICIAL="GroupDocs.$(echo "${SLOT%%/*}" | sed 's/./\U&/')"
          CONTAINER_NAME="translagent-${GITHUB_RUN_ID}-${SLOT_SLUG}"
          export OTEL_RESOURCE_ATTRIBUTES="service.namespace=$GIT_AUTHOR_NAME,deployment.environment.name=$ENVIRONMENT,deployment.environment=$ENVIRONMENT,aspose.agent.report=true,aspose.agent.product=$PRODUCT_OFFICIAL,aspose.agent.item=Product Pages,aspose.agent.job=Translation,aspose.agent.website=groupdocs.cloud,aspose.agent.website_section=Product Pages"

          docker run --rm \
            --name "$CONTAINER_NAME" \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/site:/app" \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e TRANSLATION_MODEL \
            -e OTEL_EXPORTER_OTLP_ENDPOINT \
            -e OTEL_EXPORTER_OTLP_HEADERS \
            -e OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE \
            -e OTEL_SERVICE_NAME \
            -e OTEL_RESOURCE_ATTRIBUTES \
            -e TRANSLAGENT_MAX_CONCURRENCY \
            -e GIT_AUTHOR_NAME \
            -e GIT_AUTHOR_EMAIL \
            ghcr.io/agentization/translagent:latest \
            --project-dir /app \
            --content-dir "content/english/$SLOT" \
            --output-dir "translated-content/$SLOT" \
            --max-files "$MAX_FILES" \
            --requests-per-minute "1200" \
            --target-language "$LANGUAGES" \
            >> translated.txt 2>> run.log &
          TRANSLATE_PID=$!
          # Cancellation and the budget both reach translagent via docker
          # stop. The budget is soft: the signal stops the run admitting new
          # pages and it then drains the ones already in flight, which is
          # minutes of endpoint time it would otherwise throw away. The stop
          # timeout is what must not cut that short, so it is an hour rather
          # than the grace period a kill would give.
          trap 'docker stop -t 3600 "$CONTAINER_NAME" >/dev/null 2>&1 || true' INT TERM
          while kill -0 "$TRANSLATE_PID" 2>/dev/null; do
            if [ "$(date +%s)" -ge "$STOP" ]; then
              echo "budget spent: $SLOT stops admitting pages and drains what it has"
              docker stop -t 3600 "$CONTAINER_NAME" >/dev/null 2>&1 || true
              break
            fi
            sleep 5
          done
          wait "$TRANSLATE_PID"
          STATUS=$?
          # Over 128 is the signal this job sent when the budget ran out,
          # which is how a full slot is meant to end.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -le 128 ]; then
            echo "::error::$SLOT exited $STATUS"
            exit 1
          fi
        env:
          SLOT: ${{ matrix.slot }}
          BUDGET_MINUTES: ${{ inputs.budget-minutes || '42' }}
          LANGUAGES: ${{ needs.plan.outputs.languages }}
          MAX_FILES: ${{ inputs.max-files || '100000' }}
          ENVIRONMENT: ${{ inputs.environment || 'production' }}
          # EXPERIMENT: one page at a time, so the only parallelism left is the
          # one inside a page - its frontmatter chunks and its two halves going
          # to the endpoint together. At 1 the controller's law is inert by
          # design, which is the point: this measures what chunk parallelism is
          # worth on its own, with nothing else moving. Restore "128" to end it.
          TRANSLAGENT_MAX_CONCURRENCY: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL || 'professionalize-gpt-oss' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          # The slots run side by side and metrics carry no per-process
          # identity, so all four write one cumulative series and the counts
          # interleave into nonsense - run 153 landed 64 pages and the counter
          # reported 27. Delta exports carry each process's own increment for
          # the interval, which the collector adds up, so the arithmetic is
          # right for any number of processes and no attribute is invented to
          # keep them apart.
          OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
          OTEL_SERVICE_NAME: translagent
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}

      # A budgeted run can legitimately spend everything on one page that does
      # not finish, so completed pages are the wrong evidence of a healthy run.
      # A pass that started is what separates slow from broken — a missing
      # content dir, a broken image or an empty binary never gets that far.
      - name: Guard against a silent no-op
        run: |
          if ! grep -q "translation pass starting" run.log; then
            echo "::error::translagent never started a translation pass"
            exit 1
          fi

      # Runs even when the job times out mid-run: batches of 10 are already
      # committed locally and must not be lost. Slots write disjoint subtrees,
      # so a rebase onto a sibling's push never conflicts — it only has to be
      # retried, and four of them landing at once is what needs the attempts.
      - name: Push translations
        if: always()
        working-directory: site
        run: |
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase -q origin master && git push -q origin HEAD:master && exit 0
            sleep $(( attempt * 5 ))
          done
          exit 1

      - name: Summary
        if: always()
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          {
            echo "## $SLOT"
            echo "- translated: $(grep -cE '^Translated: ' translated.txt || echo 0)"
            echo "- already current: $(grep -cE '^Up to date, skipped: ' translated.txt || echo 0)"
            echo '```'
            tail -n 20 translated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_id }}-${{ env.SLOT_SLUG }}
          path: |
            run.log
            translated.txt
          retention-days: 14

  # One dispatch pass for the whole run, after every slot has pushed. Per slot
  # it would send overlapping segment lists, and a language whose pages came
  # from two slots would redeploy twice.
  deploy:
    name: Deploy
    needs: [plan, translate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          token: ${{ secrets.REPO_TOKEN }}
          path: site
          fetch-depth: 0

      # What landed on master decides what redeploys: every translated file
      # maps to its language's segment, and one Webgentics dispatch per
      # language carries exactly the touched segments, so translations reach
      # the bucket within the hour instead of waiting for a nightly sweep.
      # Diffing against the head this run planned from deploys only what this
      # run pushed, and a dispatch that fails is a warning - the same segment
      # redeploys with the next run that lands a translation in it.
      - name: Deploy the touched segments
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          git fetch -q origin master
          SEGMENTS=$(git diff --name-only "$BASE..origin/master" -- translated-content/ | awk -F/ '
            {
              n = split($NF, parts, ".")
              if (n < 3) next
              lang = parts[n-1]
              seg = $2
              if (seg == "conversion") {
                if ($3 ~ /\./ || $3 == "family") seg = "conversion-home"
                else seg = "conversion-" $3
              }
              print lang ":" seg
            }' | sort -u)
          if [ -z "$SEGMENTS" ]; then
            echo "no translated files landed; nothing to deploy"
            exit 0
          fi
          failed=0
          total=0
          {
            echo "## Segment deploys"
            echo
            echo "| Language | Segments | Dispatch |"
            echo "| :--- | :--- | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for lang in $(echo "$SEGMENTS" | cut -d: -f1 | sort -u); do
            list=$(echo "$SEGMENTS" | grep "^$lang:" | paste -sd, -)
            total=$(( total + 1 ))
            op="l10n-${lang}-${GITHUB_RUN_NUMBER}"
            ok=""
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/webgentics.yml/dispatches" \
                -d "{\"ref\":\"master\",\"inputs\":{\"operation_id\":\"$op\",\"operation_kind\":\"connector.deploy\",\"sha_ref\":\"master\",\"website_id\":\"products.groupdocs.cloud\",\"segments\":\"$list\"}}" \
                || echo 000)
              if [ "$code" = "204" ]; then ok=yes; break; fi
              sleep $(( attempt * 5 ))
            done
            if [ -n "$ok" ]; then
              echo "| $lang | $list | queued as \`$op\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $lang | $list | **failed ($code)** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::deploy dispatch failed for $lang (HTTP $code)"
              failed=$(( failed + 1 ))
            fi
          done
          if [ "$failed" -eq "$total" ]; then
            echo "::error::every deploy dispatch failed"
            exit 1
          fi
