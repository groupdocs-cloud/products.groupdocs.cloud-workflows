name: Parameterized Deploy
run-name: Deploy [${{ inputs.run_tag }}] ${{ inputs.segments }} @ ${{ inputs.ref }} (${{ inputs.environment }})

# Deploy one slice of the site, named by segment.
#
# Segments are defined in the content repository, in Hugo's own
# config/_default/segments.yaml. That file is the single definition: this
# workflow reads it at the checked-out ref, and so does any caller deciding
# which segment a changed page belongs to. Same file, same commit - there is
# no second copy to drift.
#
#   segments: conversion-net              one segment
#   segments: conversion-net,viewer       two segments in one run
#   segments: fr:viewer                   the viewer segment, French
#
# A segment is `[<lang>:]<name>`; without a language it is English. One run
# renders one language - Hugo cannot disable its own default content language -
# so a mixed-language list is rejected rather than half-honoured.
#
# Hugo's segments filter *rendering*, not loading, so --renderSegments alone
# leaves the whole site in memory. The path globs are therefore also translated
# into ignoreFiles, which excludes at load time and is what actually bounds
# memory. Anything a segment expresses that ignoreFiles cannot - a kind or
# output filter, excludes, a non-prefix glob - is refused rather than
# approximated, because a slice looser than intended is OOM-killed minutes in
# rather than failing fast. If Hugo ever excludes at load time, delete the
# translation and keep every definition.

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: Caller's correlation tag, echoed into the run name
        type: string
        required: true
      environment:
        description: Build environment
        type: environment
        default: staging
        required: true
      ref:
        description: Branch, tag or commit SHA of the content repository
        type: string
        default: master
        required: true
      segments:
        description: >-
          Comma-separated segment names from the content repo's
          config/_default/segments.yaml, optionally `<lang>:` prefixed.
          e.g. `conversion-net` or `fr:viewer`
        type: string
        required: true

  workflow_call:
    inputs:
      run_tag: { type: string, required: true }
      environment: { type: string, required: true }
      ref: { type: string, required: true }
      segments: { type: string, required: true }

jobs:
  build:
    # The runner belongs to the site, not to the request, so it comes from an
    # Actions variable rather than an input - a caller never names it. Set
    # RUNS_ON at repository or environment level to move builds onto a bigger
    # or self-hosted runner; environment scope lets staging and production
    # differ. Unset, it stays on ubuntu-latest.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    env:
      NODE_ENV: ${{ inputs.environment }}
      HUGO_ENVIRONMENT: ${{ inputs.environment }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      SITE_URL: ${{ secrets.SITE_URL }}
      CONTENT_ROOT: content/english

    steps:
      # `ref` takes a branch, a tag or a SHA in one field - actions/checkout
      # resolves all three. fetch-depth 0 is what makes a bare SHA work at all
      # (a shallow fetch only carries branch tips), and separately it is what
      # gives each page its own sitemap lastmod instead of one shared date.
      - uses: actions/checkout@v4
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          ref: ${{ inputs.ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0

      - name: Report what was checked out
        run: |
          echo "ref input : ${{ inputs.ref }}"
          echo "resolved  : $(git rev-parse HEAD)"
          echo "describes : $(git describe --all --always HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # `hugo deploy` ships only in the withdeploy builds; the common setup
      # actions install plain extended, and the deploy then fails after the
      # whole build has run. Assert it up front instead.
      - name: Install Hugo (extended, withdeploy)
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.parse(d).tag_name.replace(/^v/,"")))')
          DEB="hugo_extended_withdeploy_${VERSION}_linux-amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$DEB" \
            "https://github.com/gohugoio/hugo/releases/download/v${VERSION}/${DEB}"
          sudo dpkg -i "$RUNNER_TEMP/$DEB"
          hugo version
          hugo deploy --help >/dev/null 2>&1 \
            || { echo "::error::installed Hugo has no deploy support"; exit 1; }

      - name: Install GNU time
        run: command -v /usr/bin/time >/dev/null || sudo apt-get install -y -qq time

      - name: Resolve segments into a Hugo config
        env:
          SEGMENTS: ${{ inputs.segments }}
        run: |
          set -euo pipefail
          rm -f config.json
          node - > hugo.json <<'NODE'
          const fs = require('fs'), yaml = require('js-yaml')
          const CONTENT_ROOT = process.env.CONTENT_ROOT || 'content/english'
          const raw = (process.env.SEGMENTS || 'en').split(',').map(s => s.trim()).filter(Boolean)
          const fail = m => { console.error(`::error::${m}`); process.exit(1) }
          if (!raw.length) fail('segments is empty')

          const SEG_FILE = 'config/_default/segments.yaml'
          if (!fs.existsSync(SEG_FILE)) fail(`no segment definitions at ${SEG_FILE}`)
          const defs = yaml.load(fs.readFileSync(SEG_FILE, 'utf8')) || {}
          const languages = Object.keys(yaml.load(
            fs.readFileSync('config/_default/languages.yaml', 'utf8')))

          // `[<lang>:]<name>` - the language is orthogonal to the slice.
          const pairs = raw.map(tok => {
            const i = tok.indexOf(':')
            if (i < 0) return { lang: 'en', name: tok }
            const lang = tok.slice(0, i)
            if (!languages.includes(lang)) fail(`unknown language "${lang}" in "${tok}"`)
            return { lang, name: tok.slice(i + 1) }
          })
          const langs = [...new Set(pairs.map(p => p.lang))]
          if (langs.length > 1)
            fail(`segments span several languages (${langs.join(', ')}); one language per run`)
          const lang = langs[0]

          // `/p/**` is a subtree; a bare `/p` is that one page. Conflating them
          // would turn `/conversion` from two pages into eighty-four thousand.
          const subtree = new Set(), exact = new Set()
          for (const { name } of pairs) {
            const seg = defs[name]
            if (!seg) fail(`unknown segment "${name}"; defined: ${Object.keys(defs).join(', ')}`)
            if (seg.excludes) fail(`segment "${name}" uses excludes, which ignoreFiles cannot express`)
            if (!Array.isArray(seg.includes) || !seg.includes.length)
              fail(`segment "${name}" has no includes`)
            for (const filter of seg.includes) {
              const extra = Object.keys(filter).filter(k => k !== 'path')
              if (extra.length)
                fail(`segment "${name}" filters on ${extra.join(', ')}, which ignoreFiles cannot express`)
              for (const alt of filter.path.replace(/^\{|\}$/g, '').split(',').map(s => s.trim())) {
                const m = alt.match(/^\/([^*{}]+?)(\/\*\*)?$/)
                if (!m) fail(`segment "${name}" path "${alt}" is not a plain prefix; cannot translate`)
                ;(m[2] ? subtree : exact).add(m[1].replace(/\/+$/, ''))
              }
            }
          }
          for (const p of [...subtree, ...exact]) {
            if (!fs.existsSync(`${CONTENT_ROOT}/${p}`)) fail(`segment path does not exist: ${p}`)
          }

          // Exclude every directory no segment reaches into; stop recursing
          // where one is wholly kept, so the list is the shortest that fits.
          const covered = rel => [...subtree].some(s => s === rel || rel.startsWith(s + '/'))
          const reaches = rel => [...subtree, ...exact].some(s => s === rel || s.startsWith(rel + '/'))
          const ignoreFiles = []
          ;(function walk (relDir, absDir) {
            for (const e of fs.readdirSync(absDir, { withFileTypes: true })) {
              if (!e.isDirectory()) continue
              const rel = relDir ? `${relDir}/${e.name}` : e.name
              if (covered(rel)) continue
              if (reaches(rel)) walk(rel, `${absDir}/${e.name}`)
              else ignoreFiles.push(`/${rel}/`)
            }
          })('', CONTENT_ROOT)

          // Names for --renderSegments, and paths for cache invalidation.
          fs.writeFileSync(process.env.RUNNER_TEMP + '/render-segments.txt',
            pairs.map(p => p.name).join(','))
          fs.writeFileSync(process.env.RUNNER_TEMP + '/slice-paths.txt',
            [...new Set([...subtree, ...exact])].join('\n'))

          process.stdout.write(JSON.stringify({
            defaultContentLanguage: lang,
            // English owns the site root; every other language owns its prefix.
            defaultContentLanguageInSubdir: lang !== 'en',
            disableLanguages: languages.filter(l => l !== lang),
            ignoreFiles
          }))
          NODE

      # config/_default beats a root config file for any key it declares, and
      # Hugo does not warn when it wins. Assert the slice actually took effect
      # rather than trust that it did.
      - name: Verify the slice took effect
        run: |
          set -euo pipefail
          node -e 'console.log(JSON.stringify(require("./hugo.json"), null, 2))' \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          hugo config > "$RUNNER_TEMP/effective.txt" 2>/dev/null
          node - <<'NODE'
          const fs = require('fs')
          const want = JSON.parse(fs.readFileSync('hugo.json', 'utf8'))
          const eff = fs.readFileSync(process.env.RUNNER_TEMP + '/effective.txt', 'utf8')
          const list = key => {
            const m = eff.match(new RegExp('^' + key + " = \\[([^\\]]*)\\]", 'mi'))
            return m ? (m[1].match(/'([^']*)'/g) || []).map(s => s.slice(1, -1)) : []
          }
          let bad = false
          const cmp = (key, expected) => {
            const got = list(key)
            if (JSON.stringify([...got].sort()) !== JSON.stringify([...expected].sort())) {
              console.log(`::error::${key} was overridden by config/_default - wanted ${
                expected.length} entries, Hugo resolved ${got.length}`)
              bad = true
            }
          }
          cmp('ignorefiles', want.ignoreFiles)
          cmp('disablelanguages', want.disableLanguages)
          if (bad) process.exit(1)

          const res = want.ignoreFiles.map(r => new RegExp(r))
          const root = process.env.CONTENT_ROOT
          let total = 0
          const per = {}
          for (const d of fs.readdirSync(root, { withFileTypes: true })) {
            if (!d.isDirectory()) continue
            let n = 0
            ;(function walk (dir) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = `${dir}/${e.name}`
                if (e.isDirectory()) walk(p)
                else if (p.endsWith('.md') && !res.some(r => r.test(p))) n++
              }
            })(`${root}/${d.name}`)
            if (n) { per[d.name] = n; total += n }
          }
          if (!total) { console.log('::error::this slice selects no content'); process.exit(1) }
          console.log(`${total} source pages selected`)
          for (const [p, n] of Object.entries(per)) console.log(`  ${p}: ${n}`)

          // ~160 KiB of peak RSS per page over a ~350 MiB floor, measured on
          // this runner class. Cheaper to warn than to be OOM-killed at 90%.
          const runnerMib = Math.round(Number((fs.readFileSync('/proc/meminfo', 'utf8')
            .match(/^MemTotal:\s+(\d+)/m) || [, 0])[1]) / 1024)
          const predicted = Math.round(350 + total * 160 / 1024)
          const pct = runnerMib ? Math.round(predicted * 100 / runnerMib) : 0
          console.log(`predicted peak ~${predicted} MiB of ${runnerMib} MiB (${pct}%)`)
          if (pct >= 80)
            console.log(`::warning::predicted peak is ${pct}% of runner memory; use narrower segments`)
          NODE

      - name: Build
        run: |
          set -euo pipefail
          # ignoreFiles bounds what is loaded; --renderSegments makes Hugo emit
          # exactly this segment's pages, so a slice does not also rewrite the
          # site-root files that every other slice would overwrite.
          RENDER=$(cat "$RUNNER_TEMP/render-segments.txt")
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" \
            hugo --environment=${{ inputs.environment }} --renderSegments "$RENDER"
          PEAK_KB=$(awk '/Maximum resident set size/ {print $NF}' "$RUNNER_TEMP/time.txt")
          WALL=$(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' "$RUNNER_TEMP/time.txt")
          PAGES=$(find public -name '*.html' | wc -l)
          TOTAL_KB=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          {
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| html pages written | $PAGES |"
            echo "| peak RSS | $((PEAK_KB / 1024)) MiB |"
            echo "| headroom used | $((PEAK_KB * 100 / TOTAL_KB))% |"
            echo "| wall clock | $WALL |"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # With the slice language as Hugo's default, a non-English build also
      # writes root-level files - the `/` alias, robots.txt, sitemap.xml -
      # which would overwrite English's. Keep only this language's prefix.
      - name: Keep only this language's sub-site
        run: |
          set -euo pipefail
          LANG_CODE=$(node -e 'process.stdout.write(require("./hugo.json").defaultContentLanguage)')
          if [ "$LANG_CODE" = "en" ]; then echo "en publishes at the root"; exit 0; fi
          test -d "public/$LANG_CODE" \
            || { echo "::error::public/$LANG_CODE was not rendered"; exit 1; }
          mv "public/$LANG_CODE" "${RUNNER_TEMP}/$LANG_CODE"
          rm -rf public && mkdir public
          mv "${RUNNER_TEMP}/$LANG_CODE" "public/$LANG_CODE"

      # STUB - uploads nothing. Reports what a real deploy would ship so the
      # rest of the pipeline can be exercised without touching the bucket.
      # Replace the body with:
      #   hugo deploy --environment=${{ inputs.environment }} --maxDeletes=0
      - name: Deploy (stub)
        run: |
          set -euo pipefail
          TARGET=$(node -e '
            const fs=require("fs"), yaml=require("js-yaml");
            const f=`config/${process.argv[1]}/deployment.yaml`;
            try { process.stdout.write(yaml.load(fs.readFileSync(f,"utf8")).targets[0].url) }
            catch (e) { process.stdout.write("(no target configured)") }
          ' "${{ inputs.environment }}")
          {
            echo "### Deploy (stub - nothing uploaded)"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| would upload to | \`$TARGET\` |"
            echo "| files | $(find public -type f | wc -l) |"
            echo "| size | $(du -sh public | cut -f1) |"
            echo "| html pages | $(find public -name '*.html' | wc -l) |"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # Derived from the segments actually built, so it purges what shipped.
      #
      # STUB - posts nothing, since the deploy above uploads nothing. The URL
      # derivation is real and is what a live run would purge. To go live,
      # drop the `echo` guard on the curl below.
      - name: Invalidate cache (stub)
        env:
          API_ENDPOINT: ${{ secrets.CACHE_INVALIDATION_API_ENDPOINT }}
          SEGMENTS: ${{ inputs.segments }}
        run: |
          set -euo pipefail
          BASE_URL="https://products-qa.groupdocs.cloud"
          if [ "${{ inputs.environment }}" = "production" ]; then
            BASE_URL="https://products.groupdocs.cloud"
          fi
          node - > "$RUNNER_TEMP/targets.txt" <<'NODE'
          const fs = require('fs')
          const cfg = JSON.parse(fs.readFileSync('hugo.json', 'utf8'))
          const lang = cfg.defaultContentLanguage
          const prefix = lang === 'en' ? '' : `/${lang}`
          const paths = fs.readFileSync(process.env.RUNNER_TEMP + '/slice-paths.txt', 'utf8')
            .split('\n').map(s => s.trim()).filter(Boolean)
          const out = paths.map(p => `${prefix}/${p}/*`)
          process.stdout.write([...new Set(out)].join('\n') + '\n')
          NODE
          {
            echo "### Cache invalidation (stub - nothing posted)"
            echo
            while read -r path; do
              [ -n "$path" ] || continue
              echo "- \`$BASE_URL$path\`"
              echo "would invalidate $BASE_URL$path" >&2
              # curl --silent --show-error --fail --output /dev/null \
              #      -d "{\"website\":\"$BASE_URL$path\"}" \
              #      -H "Content-Type: application/json" \
              #      -X POST "$API_ENDPOINT"
            done < "$RUNNER_TEMP/targets.txt"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
