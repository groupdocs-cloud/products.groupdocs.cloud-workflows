name: Gateway probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Concurrency probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe gateway concurrency
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL || 'professionalize-gpt-oss' }}
        run: python3 scripts/gateway-probe.py
