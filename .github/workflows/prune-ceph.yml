name: Prune retired pages from Ceph

# Deploys run with --maxDeletes 0, so a page deleted from git keeps its object
# in the bucket and keeps serving; this workflow is the deliberate removal path.

on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be deleted without deleting
        type: boolean
        default: true
      max_deletes:
        description: Ceiling on deletions per run
        type: string
        default: "2000"
      environment:
        type: environment
        default: production

jobs:
  prune:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 55
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      BUCKET: products.groupdocs.cloud
      SITE: https://products.groupdocs.cloud
      # A scheduled run has no inputs, so this stays dry unless a dispatch set
      # dry_run to exactly false: going live is always an explicit dispatch.
      DRY: ${{ inputs.dry_run != false }}
      MAX_DELETES: ${{ inputs.max_deletes || '2000' }}
      LOCALES: ar da de el es fa fr he id it ja ko pt ru th tr vi zh

    steps:
      - name: Checkout the content repo
        uses: actions/checkout@v4
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          ref: master
          token: ${{ secrets.REPO_TOKEN }}
          path: site
          fetch-depth: 1

      - name: Derive candidate keys
        id: derive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys

          text = open("site/products.groupdocs.cloud.redirects.txt", encoding="utf-8").read()
          _, start, rest = text.partition("### START OF redirects.js RULES ###")
          block, end, _ = rest.partition("### END OF redirects.js RULES ###")
          if not (start and end):
              print("::error::redirect rule markers not found")
              sys.exit(1)

          rule = re.compile(r"^\s*rewrite\s+\^\(.*?\)\?(/[^\s$]+)\$\s")
          paths = [m.group(1) for m in map(rule.match, block.splitlines()) if m]
          if not paths:
              print("::error::no rewrite rules between the markers")
              sys.exit(1)

          locales = os.environ["LOCALES"].split()
          tmp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(tmp, "expected-keys.txt"), "w", encoding="utf-8") as out:
              for path in paths:
                  out.write(path.lstrip("/") + "index.html\n")
                  for locale in locales:
                      out.write(locale + path + "index.html\n")
          with open(os.path.join(tmp, "first-path.txt"), "w", encoding="utf-8") as out:
              out.write(paths[0] + "\n")

          keys = len(paths) * (1 + len(locales))
          print(f"{len(paths)} rules, {keys} expected keys")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"rules={len(paths)}\nkeys={keys}\n")
          PY

      # An object is only removed once its URL actually answers 301 in
      # production; the CDN-side redirects ship separately and may lag.
      - name: Gate on live redirects
        id: gate
        run: |
          set -euo pipefail
          path=$(head -n 1 "$RUNNER_TEMP/first-path.txt")
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE$path" || true)
          if [ "$code" = "301" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "redirects not live yet - nothing to prune" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: List retired objects still in the bucket
        if: steps.gate.outputs.live == 'true'
        run: |
          set -euo pipefail
          listed="$RUNNER_TEMP/listed-keys.txt"
          : > "$listed"
          prefixes="conversion/"
          for locale in $LOCALES; do prefixes="$prefixes $locale/conversion/"; done
          for p in $prefixes; do
            token=""
            while :; do
              if [ -n "$token" ]; then
                page=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$p" \
                  --continuation-token "$token" --output json)
              else
                page=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$p" \
                  --output json)
              fi
              printf '%s\n' "$page" | jq -r '.Contents[]?.Key' >> "$listed"
              token=$(printf '%s\n' "$page" | jq -r '.NextContinuationToken // empty')
              [ -n "$token" ] || break
            done
          done
          sort -u "$RUNNER_TEMP/expected-keys.txt" > "$RUNNER_TEMP/expected-sorted.txt"
          sort -u "$listed" > "$RUNNER_TEMP/listed-sorted.txt"
          comm -12 "$RUNNER_TEMP/expected-sorted.txt" "$RUNNER_TEMP/listed-sorted.txt" \
            > "$RUNNER_TEMP/candidates.txt"
          echo "$(wc -l < "$listed") objects listed, $(wc -l < "$RUNNER_TEMP/candidates.txt") candidates"

      - name: Prune
        if: steps.gate.outputs.live == 'true'
        id: prune
        run: |
          set -euo pipefail
          checked=0
          deleted=0
          skipped=0
          while IFS= read -r key; do
            [ "$checked" -lt "$MAX_DELETES" ] || break
            url="$SITE/${key%index.html}"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
            checked=$((checked + 1))
            if [ "$code" = "301" ]; then
              if [ "$DRY" != "true" ]; then
                aws s3api delete-object --bucket "$BUCKET" --key "$key" < /dev/null > /dev/null
              fi
              deleted=$((deleted + 1))
            else
              skipped=$((skipped + 1))
              if [ "$checked" -eq 25 ] && [ "$skipped" -eq 25 ]; then
                echo "::error::redirects partially live - refusing to continue"
                exit 1
              fi
            fi
          done < "$RUNNER_TEMP/candidates.txt"
          {
            echo "checked=$checked"
            echo "deleted=$deleted"
            echo "skipped=$skipped"
          } >> "$GITHUB_OUTPUT"
          echo "checked $checked, deleted (or would delete) $deleted, skipped $skipped"

      - name: Summary
        if: steps.gate.outputs.live == 'true'
        env:
          RULES: ${{ steps.derive.outputs.rules }}
          KEYS: ${{ steps.derive.outputs.keys }}
          CHECKED: ${{ steps.prune.outputs.checked }}
          DELETED: ${{ steps.prune.outputs.deleted }}
          SKIPPED: ${{ steps.prune.outputs.skipped }}
        run: |
          set -euo pipefail
          total=$(wc -l < "$RUNNER_TEMP/candidates.txt")
          if [ "$DRY" = "true" ]; then
            mode=dry
            action="Would delete"
          else
            mode=live
            action="Deleted"
          fi
          {
            echo "## Ceph prune"
            echo
            echo "| Measure | Value |"
            echo "| :--- | ---: |"
            echo "| Mode | $mode |"
            echo "| Redirect rules | $RULES |"
            echo "| Expected keys | $KEYS |"
            echo "| Listed matches | $total |"
            echo "| Checked | $CHECKED |"
            echo "| $action | $DELETED |"
            echo "| Skipped non-301 | $SKIPPED |"
            echo "| Remaining candidates | $((total - CHECKED)) |"
            echo
            echo "<details><summary>Sample of candidate keys (first 20)</summary>"
            echo
            echo '```'
            head -n 20 "$RUNNER_TEMP/candidates.txt"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
