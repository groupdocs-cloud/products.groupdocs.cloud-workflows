name: Hugo Deploy
run-name: Hugo Deploy${{ inputs.run_tag && format(' [{0}]', inputs.run_tag) || '' }} (${{ inputs.environment }})

# One slice of the site: one language, one product, one runner.
#
# Every page is committed, so this workflow renders and ships - it generates
# nothing. `hugo_config` is the whole build definition: it is written to
# hugo.json at the repo root and it alone decides which language and which
# content this run produces. There are deliberately no `language` or `product`
# inputs, because a second source of truth can disagree with the first.
#
# The slice must be cut with `ignoreFiles`. It is the only mechanism that both
# bounds memory and cannot break anything it does not name: `segments` filters
# rendering after the full object graph is already in memory, and mount
# `excludeFiles` replaces the mount array wholesale, so one omission silently
# drops the theme's vendored assets.
#
# Two automated callers share this file and divide by language: webgentics
# owns `content/english` and deploys `en`; translagent owns
# `translated-content` and deploys the rest. Their S3 prefixes are disjoint -
# English at the root, each translation under its own - so the two never
# overwrite each other and can run at the same time. Neither is named here: a
# caller passes `run_tag`, which is echoed into the run name so it can find
# its own run again.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build environment
        type: environment
        default: staging
        required: true
      branch:
        description: Branch to checkout
        type: string
        default: master
        required: true
      hugo_config:
        description: >-
          Complete root hugo.json, minified. Must set defaultContentLanguage,
          disable every other language, and cut the slice with ignoreFiles.
        type: string
        required: true
      run_tag:
        description: Caller's correlation tag, echoed verbatim into the run name
        type: string
        required: false
      expected_commit:
        description: Commit the caller expects this run to deploy
        type: string
        required: false

  workflow_call:
    inputs:
      environment: { type: string, required: true }
      branch: { type: string, required: true }
      hugo_config: { type: string, required: true }
      run_tag: { type: string, required: false }
      expected_commit: { type: string, required: false }

jobs:
  build:
    # Linux, not macOS: the big heap was for the page generators, and they are
    # gone. This is a render and an upload.
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      NODE_ENV: ${{ inputs.environment }}
      HUGO_ENVIRONMENT: ${{ inputs.environment }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      SITE_URL: ${{ secrets.SITE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          ref: ${{ inputs.branch }}
          token: ${{ secrets.REPO_TOKEN }}

      - name: Assert the expected commit
        if: inputs.expected_commit != ''
        env:
          EXPECTED: ${{ inputs.expected_commit }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          case "$ACTUAL" in
            "$EXPECTED"*) echo "at $ACTUAL" ;;
            *) echo "::error::expected $EXPECTED, checked out $ACTUAL"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is not committed, so this cannot be `npm ci`. The
      # install is still required: the theme's vendored assets and the shared
      # data and i18n packages are mounted straight out of node_modules.
      - run: npm install --no-audit --no-fund

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      # A stale config.json would be read as a second Hugo config file.
      - name: Write and validate hugo.json
        env:
          HUGO_CONFIG: ${{ inputs.hugo_config }}
        run: |
          set -euo pipefail
          rm -f config.json
          printf '%s' "$HUGO_CONFIG" > hugo.json
          node - <<'NODE'
          const fs = require('fs'), yaml = require('js-yaml')
          let cfg
          try { cfg = JSON.parse(fs.readFileSync('hugo.json', 'utf8')) }
          catch (e) { console.log(`::error::hugo_config is not valid JSON: ${e.message}`); process.exit(1) }

          const known = Object.keys(yaml.load(
            fs.readFileSync('config/_default/languages.yaml', 'utf8')))
          const lang = cfg.defaultContentLanguage
          const fail = m => { console.log(`::error::${m}`); process.exitCode = 1 }

          if (!lang) { fail('hugo_config must set defaultContentLanguage'); process.exit(1) }
          if (!known.includes(lang)) { fail(`unknown language ${lang}`); process.exit(1) }

          // Every other language must be off. Hugo forbids disabling the
          // default content language, so exactly one survives.
          const off = new Set(cfg.disableLanguages || [])
          const live = known.filter(l => l !== lang && !off.has(l))
          if (live.length) fail(`these languages are still enabled: ${live.join(', ')}`)

          if (lang !== 'en' && cfg.defaultContentLanguageInSubdir !== true)
            fail(`${lang} needs defaultContentLanguageInSubdir true or it would publish to the site root`)
          if (lang === 'en' && cfg.defaultContentLanguageInSubdir === true)
            fail('en must publish to the site root, not a subdirectory')

          if (!Array.isArray(cfg.ignoreFiles) || !cfg.ignoreFiles.length)
            fail('hugo_config must cut the slice with a non-empty ignoreFiles')
          if (cfg.module)
            fail('module.mounts in a root config is ignored by Hugo; config/_default/module.yaml wins')

          // What actually survives the filter, so the log shows the real slice.
          // Counted per product: the site root always survives, so a config
          // that excludes every product would otherwise look like a live slice.
          const res = cfg.ignoreFiles.map(r => new RegExp(r))
          const root = 'content/english'
          const perProduct = {}
          for (const d of fs.readdirSync(root, { withFileTypes: true })) {
            if (!d.isDirectory()) continue
            let n = 0
            ;(function walk (dir) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = `${dir}/${e.name}`
                if (e.isDirectory()) walk(p)
                else if (p.endsWith('.md') && !res.some(r => r.test(p))) n++
              }
            })(`${root}/${d.name}`)
            if (n) perProduct[d.name] = n
          }
          const total = Object.values(perProduct).reduce((a, b) => a + b, 0)
          if (!total) fail('ignoreFiles leaves no product content; nothing would be built')
          console.log(`language ${lang} - ${total} source pages survive ignoreFiles`)
          for (const [p, n] of Object.entries(perProduct)) console.log(`  ${p}: ${n}`)
          NODE

      # The config arrives minified to stay well inside the input size limit,
      # so print it readable - this is the record of what the run actually built.
      - name: Show hugo.json
        run: |
          node -e 'console.log(JSON.stringify(require("./hugo.json"), null, 2))' \
            | tee "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Build
        run: hugo --environment=${{ inputs.environment }}

      # Once the slice language is Hugo's default, a non-English build also
      # writes root-level files - the `/` alias, robots.txt, sitemap.xml -
      # because that language is now the site default. Uploading them would
      # overwrite English's. Keep only the language's own prefix.
      - name: Keep only this language's sub-site
        run: |
          set -euo pipefail
          LANG_CODE=$(node -e 'process.stdout.write(require("./hugo.json").defaultContentLanguage)')
          if [ "$LANG_CODE" = "en" ]; then
            echo "en publishes at the root; nothing to trim"
            exit 0
          fi
          test -d "public/$LANG_CODE" \
            || { echo "::error::public/$LANG_CODE was not rendered"; exit 1; }
          mv "public/$LANG_CODE" "${RUNNER_TEMP}/$LANG_CODE"
          rm -rf public && mkdir public
          mv "${RUNNER_TEMP}/$LANG_CODE" "public/$LANG_CODE"

      - name: Deploy
        run: hugo deploy --environment=${{ inputs.environment }} --maxDeletes=0

      # Derived from the config rather than from inputs, so it invalidates what
      # was actually built. A product whose platforms all survived collapses to
      # one pattern; a partial slice invalidates only the platforms it shipped.
      - name: Invalidate cache
        env:
          API_ENDPOINT: ${{ secrets.CACHE_INVALIDATION_API_ENDPOINT }}
        run: |
          set -euo pipefail
          BASE_URL="https://products-qa.groupdocs.cloud"
          if [ "${{ inputs.environment }}" = "production" ]; then
            BASE_URL="https://products.groupdocs.cloud"
          fi

          node - <<'NODE' > targets.txt
          const fs = require('fs')
          const cfg = JSON.parse(fs.readFileSync('hugo.json', 'utf8'))
          const lang = cfg.defaultContentLanguage
          const prefix = lang === 'en' ? '' : `/${lang}`
          const res = cfg.ignoreFiles.map(r => new RegExp(r))
          const live = p => !res.some(r => r.test(p))
          const out = []
          const root = 'content/english'
          for (const product of fs.readdirSync(root, { withFileTypes: true })
                                  .filter(d => d.isDirectory()).map(d => d.name)) {
            const dir = `${root}/${product}`
            const platforms = fs.readdirSync(dir, { withFileTypes: true })
              .filter(d => d.isDirectory()).map(d => d.name)
            const kept = platforms.filter(p => live(`${dir}/${p}/`))
            if (!platforms.length) {
              if (live(`${dir}/`)) out.push(`${prefix}/${product}/*`)
            } else if (kept.length === platforms.length) {
              if (live(`${dir}/`)) out.push(`${prefix}/${product}/*`)
            } else {
              for (const p of kept) out.push(`${prefix}/${product}/${p}/*`)
            }
          }
          process.stdout.write(out.join('\n') + (out.length ? '\n' : ''))
          NODE

          if [ ! -s targets.txt ]; then
            echo "::error::no invalidation targets derived from hugo.json"; exit 1
          fi

          while read -r path; do
            [ -n "$path" ] || continue
            echo "invalidating $BASE_URL$path"
            curl --silent --show-error --fail \
                 --output /dev/null \
                 -d "{\"website\":\"$BASE_URL$path\"}" \
                 -H "Content-Type: application/json" \
                 -X POST "$API_ENDPOINT"
          done < targets.txt
