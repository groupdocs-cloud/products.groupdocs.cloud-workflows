name: Segmented build experiment
run-name: Segments experiment (${{ inputs.product }}/${{ inputs.language }})

# Measures whether Hugo's `segments` feature can replace the config-slicing
# workarounds, and what it costs. Builds the same site three ways and reports
# peak memory, wall time and what landed in public/:
#
#   1. baseline          - no slicing at all
#   2. segments only     - full mounts, output filtered by --renderSegments
#   3. segments + ignore - content excluded at load time as well
#
# Nothing is deployed. This writes no files outside the runner.

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to slice to
        type: string
        default: viewer
        required: true
      language:
        description: Language to slice to
        type: string
        default: en
        required: true
      generate_pages:
        description: Run the repo's page generators first (realistic corpus)
        type: boolean
        default: true
      hugo_version:
        description: Hugo version
        type: string
        default: latest
        required: true
      branch:
        description: Content branch to check out
        type: string
        default: master
        required: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRODUCT: ${{ inputs.product }}
      LANGUAGE: ${{ inputs.language }}
      # The generators gate on this: `helpers.isProduction` is
      # HUGO_ENVIRONMENT === 'production' || NODE_ENV === 'production', and the
      # viewer/conversion generators emit only docx pages without it — which
      # would make every measurement below meaningless.
      HUGO_ENVIRONMENT: production
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=11111

    steps:
      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          ref: ${{ inputs.branch }}
          token: ${{ secrets.REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo_version }}
          extended: true

      - name: Hugo version
        run: hugo version

      # Always: `configure` also calls helpers.create_lang_dirs(), which makes
      # the locales/ and i18n/ directories the module mounts expect. Skipping
      # it leaves mount sources missing before Hugo ever starts.
      - name: Configure
        run: npm run configure

      - name: Generate pages
        if: inputs.generate_pages
        run: npx npm-run-all pages:multilingual pages:GroupDocs.Viewer pages:GroupDocs.Conversion pages:GroupDocs.Parser "pages:GroupDocs.Parser:Barcode" pages:generate

      - name: Corpus size
        run: |
          # No `set -e`: the runner already invokes `bash -e`, and a `find`
          # over a directory the generators never created exits 1, which would
          # kill the step before it reports anything.
          set +e
          # Only the content roots that actually exist on this run.
          ROOTS=""
          for d in content generated-content translated-content; do
            [ -d "$d" ] && ROOTS="$ROOTS $d"
          done
          echo "content roots present:$ROOTS"
          echo "=== file counts ==="
          echo "committed english pages : $(find content/english -name '*.md' | wc -l)"
          echo "translated-content files: $(find translated-content -name '*.md' 2>/dev/null | wc -l)"
          echo "generated-content files : $(find generated-content -type f 2>/dev/null | wc -l)"
          echo "total markdown in tree  : $(find $ROOTS -name '*.md' 2>/dev/null | wc -l)"

          echo "=== raw bytes on disk ==="
          du -sh $ROOTS 2>/dev/null

          echo "=== ENGLISH ONLY (webgentics's scope) ==="
          # Generated pages carry a .<lang>.md suffix; authored ones do not.
          EN_FILES=$(find $ROOTS \( -name '*.en.md' -o -name '_index.md' \) 2>/dev/null)
          EN_COUNT=$(echo "$EN_FILES" | grep -c . || true)
          EN_BYTES=$(echo "$EN_FILES" | grep . | xargs -r du -cb 2>/dev/null | tail -1 | cut -f1)
          echo "english files : ${EN_COUNT}"
          echo "english bytes : ${EN_BYTES:-0} ($(( ${EN_BYTES:-0} / 1048576 )) MiB)"
          [ "${EN_COUNT:-0}" -gt 0 ] && echo "avg per page  : $(( ${EN_BYTES:-0} / EN_COUNT )) bytes"

          echo "=== files per language suffix (top 25) ==="
          find $ROOTS -name '*.*.md' 2>/dev/null \
            | sed -E 's/.*\.([a-z]{2})\.md$/\1/' | sort | uniq -c | sort -rn | head -25

          echo "=== markdown files per product (top 12) ==="
          for d in content/english/*/; do
            printf '%9s  %s\n' "$(find "$d" -name '*.md' 2>/dev/null | wc -l)" "$(basename "$d")"
          done | sort -rn | head -12

          echo "=== what git would actually store ==="
          echo "-- before staging --"
          git count-objects -vH | grep -E "^(count|size|in-pack|size-pack):"
          # The generated pages are gitignored, so -f is required to stage them.
          git add -Af $ROOTS 2>/dev/null
          echo "-- after staging the corpus (loose, zlib per file) --"
          git count-objects -vH | grep -E "^(count|size|in-pack|size-pack):"
          echo "-- after repack (delta compression across near-identical pages) --"
          git repack -adq 2>/dev/null || true
          git count-objects -vH | grep -E "^(count|size|in-pack|size-pack):"
          # Leave the tree as found so the builds below are unaffected.
          git reset -q

      # configure.cjs wrote config.json above; drop it so each measured build
      # is driven only by the hugo.json it writes.
      - name: Clear generated config
        run: rm -f config.json

      - name: 1. Baseline — no slicing
        run: |
          set -uo pipefail
          rm -rf public hugo.json
          if /usr/bin/time -v hugo --environment=production >build.log 2>time.log; then
            echo "RESULT: baseline ok"
          else
            echo "::warning::baseline build failed (exit $?)"
            echo "--- hugo stdout"; tail -n 40 build.log
            echo "--- hugo stderr / time"; tail -n 40 time.log
          fi
          echo "--- pages";       tail -n 15 build.log
          echo "--- peak memory"; grep "Maximum resident set size" time.log || true
          echo "--- wall time";   grep "Elapsed (wall clock)" time.log || true
          echo "--- files in public"; find public -type f 2>/dev/null | wc -l
          echo "--- public/ top level"; ls public 2>/dev/null | head -25

      - name: 2. Segments only — full mounts, filtered output
        run: |
          set -uo pipefail
          rm -rf public
          cat > hugo.json <<JSON
          {
            "segments": {
              "slice": {
                "includes": [
                  { "path": "{/$PRODUCT,/$PRODUCT/**}", "lang": "$LANGUAGE" }
                ]
              }
            }
          }
          JSON
          cat hugo.json
          if /usr/bin/time -v hugo --environment=production --renderSegments slice \
               >build.log 2>time.log; then
            echo "RESULT: segments ok"
          else
            echo "::warning::segments build failed (exit $?)"
            echo "--- hugo stdout"; tail -n 40 build.log
            echo "--- hugo stderr / time"; tail -n 40 time.log
          fi
          echo "--- pages";       tail -n 15 build.log
          echo "--- peak memory"; grep "Maximum resident set size" time.log || true
          echo "--- wall time";   grep "Elapsed (wall clock)" time.log || true
          echo "--- files in public"; find public -type f 2>/dev/null | wc -l
          echo "--- public/ top level"; ls public 2>/dev/null | head -25
          echo "--- did it write root files? (the trim question)"
          for f in index.html robots.txt sitemap.xml 404.html; do
            if [ -f "public/$f" ]; then echo "  PRESENT public/$f"; else echo "  absent  public/$f"; fi
          done

      - name: 3. Segments + load-time exclusion
        run: |
          set -uo pipefail
          rm -rf public
          IGNORE=$(for p in $(ls content/english); do
                     [ "$p" != "$PRODUCT" ] && printf '"/%s/",' "$p"; done | sed 's/,$//')
          cat > hugo.json <<JSON
          {
            "ignoreFiles": [ $IGNORE ],
            "segments": {
              "slice": {
                "includes": [
                  { "path": "{/$PRODUCT,/$PRODUCT/**}", "lang": "$LANGUAGE" }
                ]
              }
            }
          }
          JSON
          cat hugo.json
          if /usr/bin/time -v hugo --environment=production --renderSegments slice \
               >build.log 2>time.log; then
            echo "RESULT: segments+ignore ok"
          else
            echo "::warning::segments+ignore build failed (exit $?)"
            echo "--- hugo stdout"; tail -n 40 build.log
            echo "--- hugo stderr / time"; tail -n 40 time.log
          fi
          echo "--- pages";       tail -n 15 build.log
          echo "--- peak memory"; grep "Maximum resident set size" time.log || true
          echo "--- wall time";   grep "Elapsed (wall clock)" time.log || true
          echo "--- files in public"; find public -type f 2>/dev/null | wc -l
          echo "--- sample output paths"; find public -type f -name '*.html' 2>/dev/null | head -10
