name: Translate
run-name: "Translate ${{ inputs.product }} → ${{ inputs.language }} (max ${{ inputs.max-files }})"

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Subfolder of content/english to translate (e.g. conversion)"
        required: true
        type: string
      language:
        description: "Target language code (e.g. es)"
        required: true
        type: string
      max-files:
        description: "Files this run may process (skips count toward it)"
        required: false
        default: "20000"
        type: string
      environment:
        description: "Reporting environment (test rows are auto-purged nightly)"
        required: false
        default: "production"
        type: string

concurrency:
  group: translate-${{ inputs.product }}-${{ inputs.language }}
  cancel-in-progress: false

jobs:
  translate:
    name: ${{ inputs.product }} → ${{ inputs.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          token: ${{ secrets.REPO_TOKEN }}
          path: site
          # Full history: translagent judges freshness by last-commit times.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Pull translagent
        run: docker pull ghcr.io/agentization/translagent:latest

      - name: Configure git identity
        working-directory: site
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Compute reporting attributes
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
        run: |
          PRODUCT_OFFICIAL="GroupDocs.$(echo "${{ inputs.product }}" | sed 's/./\U&/')"
          echo "OTEL_RESOURCE_ATTRIBUTES=service.namespace=$GIT_AUTHOR_NAME,deployment.environment.name=${{ inputs.environment }},deployment.environment=${{ inputs.environment }},aspose.agent.product=$PRODUCT_OFFICIAL,aspose.agent.item=Product Pages,aspose.agent.job=Docs Translation,aspose.agent.website=groupdocs.cloud,aspose.agent.website_section=Product Pages" >> "$GITHUB_ENV"

      - name: Translate
        run: |
          docker run --rm \
            --name "$CONTAINER_NAME" \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/site:/app" \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e TRANSLATION_MODEL \
            -e OTEL_EXPORTER_OTLP_ENDPOINT \
            -e OTEL_EXPORTER_OTLP_HEADERS \
            -e OTEL_SERVICE_NAME \
            -e OTEL_RESOURCE_ATTRIBUTES \
            -e GIT_AUTHOR_NAME \
            -e GIT_AUTHOR_EMAIL \
            ghcr.io/agentization/translagent:latest \
            --project-dir /app \
            --content-dir "content/english/${{ inputs.product }}" \
            --output-dir "translated-content/${{ inputs.product }}" \
            --max-files "${{ inputs.max-files }}" \
            --target-language "${{ inputs.language }}" \
            > translated.txt 2> run.log &
          TRANSLATE_PID=$!
          # Cancellation reaches translagent via docker stop; it commits finished work before exiting.
          trap 'docker stop -t 55 "$CONTAINER_NAME" || true' INT TERM
          wait "$TRANSLATE_PID"
          STATUS=$?
          if [ "$STATUS" -gt 128 ]; then
            wait "$TRANSLATE_PID"
            STATUS=$?
          fi
          exit "$STATUS"
        env:
          CONTAINER_NAME: translagent-${{ github.run_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL || 'professionalize-gpt-oss' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_SERVICE_NAME: translagent
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}

      # A run that neither translated nor skipped anything did no work at
      # all — a missing content dir, a broken image, or an empty binary.
      - name: Guard against a silent no-op
        run: |
          if ! grep -qE "^(Translated|Up to date, skipped): " translated.txt; then
            echo "::error::translagent produced no output — neither a translation nor a skip"
            exit 1
          fi

      # Runs even when the job times out mid-run: batches of 10 are already
      # committed locally and must not be lost.
      - name: Push translations
        if: always()
        working-directory: site
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 10
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## ${{ inputs.product }} → ${{ inputs.language }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 translated.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -cE "^Translated: " translated.txt \
            | xargs -I{} echo "Files translated this run: {}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ inputs.product }}-${{ inputs.language }}-${{ github.run_id }}
          path: |
            run.log
            translated.txt
          retention-days: 14
