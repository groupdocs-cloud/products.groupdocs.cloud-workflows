ewriter,da:rewriter,de:rewriter,el:rewriter,rewriter,es:rewriter,fa:rewriter,fr:rewriter,he:rewriter,id:rewriter,it:rewriter,ja:rewriter,ko:rewriter,pt:rewriter,ru:rewriter,th:rewriter,tr:rewriter,vi:rewriter,zh:rewriter,ar:signature,da:signature,de:signature,el:signature,signature,es:signature,fa:signature,fr:signature,he:signature,id:signature,it:signature,ja:signature,ko:signature,pt:signature,ru:signature,th:signature,tr:signature,vi:signature,zh:signature,ar:total,da:total,de:total,el:total,total,es:total,fa:total,fr:total,he:total,id:total,it:total,ja:total,ko:total,pt:total,ru:total,th:total,tr:total,vi:total,zh:total,ar:translation,da:translation,de:translation,el:translation,translation,es:translation,fa:translation,fr:translation,he:translation,id:translation,it:translation,ja:translation,ko:translation,pt:translation,ru:translation,th:translation,tr:translation,vi:translation,zh:translation,ar:watermark,da:watermark,de:watermark,el:watermark,watermark,es:watermark,fa:watermark,fr:watermark,he:watermark,id:watermark,it:watermark,ja:watermark,ko:watermark,pt:watermark,ru:watermark,th:watermark,tr:watermark,vi:watermark,zh:watermark,ar:parser,da:parser,de:parser,el:parser,parser,es:parser,fa:parser,fr:parser,he:parser,id:parser,it:parser,ja:parser,ko:parser,pt:parser,ru:parser,th:parser,tr:parser,vi:parser,zh:parser,ar:metadata,da:metadata,de:metadata,el:metadata,metadata,es:metadata,fa:metadata,fr:metadata,he:metadata,id:metadata,it:metadata,ja:metadata,ko:metadata,pt:metadata,ru:metadata,th:metadata,tr:metadata,vi:metadata,zh:metadata
          viewer ar:viewer,da:viewer,de:viewer,el:viewer,viewer,es:viewer,fa:viewer,fr:viewer,he:viewer,id:viewer,it:viewer,ja:viewer,ko:viewer,pt:viewer,ru:viewer,th:viewer,tr:viewer,vi:viewer,zh:viewer
