name: Translate
run-name: "Translate ${{ inputs.products || 'every product' }} → ${{ inputs.languages || 'every language' }}"

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      products:
        description: "Comma-separated products, or empty for the demand rotation (2 anchors + 2 rotating slots)"
        required: false
        default: ""
        type: string
      languages:
        description: "Comma-separated target language codes, or empty for every site language"
        required: false
        default: ""
        type: string
      max-files:
        description: "Files one product may process (skips count toward it)"
        required: false
        default: "100000"
        type: string
      budget-minutes:
        description: "Minutes of translating before the run stops itself and pushes"
        required: false
        default: "42"
        type: string
      environment:
        description: "Reporting environment (test rows are auto-purged nightly)"
        required: false
        default: "production"
        type: string

# One run at a time: an hourly schedule against a run that may spend its whole
# budget would otherwise overlap itself.
concurrency:
  group: translate
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  translate:
    name: Translate
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          token: ${{ secrets.REPO_TOKEN }}
          path: site
          # Full history: translagent judges freshness by last-commit times.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Pull translagent
        run: docker pull ghcr.io/agentization/translagent:latest

      - name: Configure git identity
        working-directory: site
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Record the pre-run head
        id: base
        working-directory: site
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          extended: true

      # The default target list is the site's own roster: the effective Hugo
      # config's languages minus the default content language, so a language
      # added to the site starts translating without a workflow edit. The
      # order is search demand, because a run that ends on its budget has
      # translated a prefix of it, and the page-major walk spends that prefix
      # on every page it reaches.
      - name: Resolve the target languages
        id: languages
        env:
          REQUESTED: ${{ inputs.languages || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            echo "list=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hugo config --source site --format json > "$RUNNER_TEMP/effective.json"
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          cfg = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "effective.json")))
          langs = set(cfg["languages"]) - {cfg["defaultcontentlanguage"]}
          # Impressions per locale, Search Console 2026-05-23..2026-08-18: ru
          # alone is 18% of the site's demand and da is 0.03%. A language the
          # site adds that is not ranked here joins the end alphabetically.
          ranked = "ru es pt id fr it fa ja de zh he ar vi ko el tr th da".split()
          order = [l for l in ranked if l in langs] + sorted(langs - set(ranked))
          print("list=" + ",".join(order))
          PY

      # Four products a run, not a sliver of every product: with fifteen
      # slices the share was shorter than the pages it opened, so slice ends
      # abandoned whatever was in flight and runs spent themselves re-walking
      # skip prefixes. conversion and viewer carry ~92% of search impressions
      # and anchor every run; two slots rotate through the rest by run number,
      # so every product sees budget within a day while capacity follows
      # demand. A product that finishes inside its slice still hands the rest
      # to the ones after it.
      - name: Translate
        run: |
          set -u
          DEADLINE=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          REACHED=0
          FAILED=0

          if [ -n "$PRODUCTS_INPUT" ]; then
            PRODUCTS=$(echo "$PRODUCTS_INPUT" | tr ',' '\n' | sed '/^$/d')
          else
            # Impressions per product, Search Console 2026-05-07..2026-08-05,
            # all locales summed. Products on disk that the ranking does not
            # know join the end of the rotation.
            RANKED="conversion viewer parser metadata translation signature editor merger rewriter comparison assembly annotation watermark classification total"
            EXISTING=$(for dir in site/content/english/*/; do
                [ -d "$dir" ] || continue
                basename "$dir"
              done)
            ORDERED=""
            for p in $RANKED; do
              echo "$EXISTING" | grep -qx "$p" && ORDERED="$ORDERED $p"
            done
            for e in $EXISTING; do
              case " $RANKED " in *" $e "*) ;; *) ORDERED="$ORDERED $e" ;; esac
            done
            ANCHORS=$(echo $ORDERED | tr ' ' '\n' | head -2)
            TAIL=$(echo $ORDERED | tr ' ' '\n' | tail -n +3)
            TAIL_LEN=$(echo "$TAIL" | sed '/^$/d' | wc -l)
            WINDOW=""
            if [ "$TAIL_LEN" -gt 0 ]; then
              START=$(( GITHUB_RUN_NUMBER * 2 % TAIL_LEN ))
              WINDOW=$(echo "$TAIL" | awk -v s="$START" \
                '{t[NR-1]=$0} END {for (i = 0; i < 2 && i < NR; i++) print t[(s + i) % NR]}')
            fi
            PRODUCTS=$(printf '%s\n%s\n' "$ANCHORS" "$WINDOW" | sed '/^$/d')
          fi
          TOTAL=$(echo "$PRODUCTS" | wc -l)
          echo "order: $(echo $PRODUCTS | tr '\n' ' ')"

          INDEX=0
          for product in $PRODUCTS; do
            INDEX=$(( INDEX + 1 ))
            remaining=$(( DEADLINE - $(date +%s) ))
            if [ "$remaining" -le 60 ]; then
              echo "budget spent before $product"
              break
            fi
            # An equal share of what is left, recomputed each time, so the
            # products that finish early enlarge the shares of those after.
            SLICE=$(( remaining / (TOTAL - INDEX + 1) ))
            [ "$SLICE" -lt 60 ] && SLICE=60
            STOP=$(( $(date +%s) + SLICE ))
            [ "$STOP" -gt "$DEADLINE" ] && STOP=$DEADLINE
            if [ ! -d "site/content/english/$product" ]; then
              echo "::warning::no such product: $product"
              continue
            fi

            CONTAINER_NAME="translagent-${GITHUB_RUN_ID}-${product}"
            PRODUCT_OFFICIAL="GroupDocs.$(echo "$product" | sed 's/./\U&/')"
            export OTEL_RESOURCE_ATTRIBUTES="service.namespace=$GIT_AUTHOR_NAME,deployment.environment.name=$ENVIRONMENT,deployment.environment=$ENVIRONMENT,aspose.agent.report=true,aspose.agent.product=$PRODUCT_OFFICIAL,aspose.agent.item=Product Pages,aspose.agent.job=Translation,aspose.agent.website=groupdocs.cloud,aspose.agent.website_section=Product Pages"

            echo "::group::$product (${SLICE}s slice of ${remaining}s left)"
            docker run --rm \
              --name "$CONTAINER_NAME" \
              --user "$(id -u):$(id -g)" \
              -v "${{ github.workspace }}/site:/app" \
              -e OPENAI_API_KEY \
              -e OPENAI_BASE_URL \
              -e TRANSLATION_MODEL \
              -e OTEL_EXPORTER_OTLP_ENDPOINT \
              -e OTEL_EXPORTER_OTLP_HEADERS \
              -e OTEL_SERVICE_NAME \
              -e OTEL_RESOURCE_ATTRIBUTES \
              -e TRANSLAGENT_MAX_CONCURRENCY \
              -e GIT_AUTHOR_NAME \
              -e GIT_AUTHOR_EMAIL \
              ghcr.io/agentization/translagent:latest \
              --project-dir /app \
              --content-dir "content/english/$product" \
              --output-dir "translated-content/$product" \
              --max-files "$MAX_FILES" \
              --requests-per-minute "1200" \
              --target-language "$LANGUAGES" \
              >> translated.txt 2>> run.log &
            TRANSLATE_PID=$!
            # Cancellation and the budget both reach translagent via docker
            # stop; it commits finished work before exiting.
            trap 'docker stop -t 55 "$CONTAINER_NAME" >/dev/null 2>&1 || true' INT TERM
            while kill -0 "$TRANSLATE_PID" 2>/dev/null; do
              if [ "$(date +%s)" -ge "$STOP" ]; then
                echo "slice spent: stopping $product"
                docker stop -t 55 "$CONTAINER_NAME" >/dev/null 2>&1 || true
                break
              fi
              sleep 5
            done
            wait "$TRANSLATE_PID"
            STATUS=$?
            REACHED=$(( REACHED + 1 ))
            if [ "$STATUS" -ne 0 ] && [ "$STATUS" -le 128 ]; then
              echo "::warning::$product exited $STATUS"
              FAILED=$(( FAILED + 1 ))
            fi
            echo "::endgroup::"
          done

          if [ "$REACHED" -eq 0 ]; then
            echo "::error::no product was run: none of [$PRODUCTS] exists"
            exit 1
          fi
          # One product failing is that product's content; every product this
          # run reached failing is the endpoint, the image or the credentials.
          if [ "$FAILED" -eq "$REACHED" ]; then
            echo "::error::every product this run reached failed"
            exit 1
          fi
        env:
          BUDGET_MINUTES: ${{ inputs.budget-minutes || '42' }}
          PRODUCTS_INPUT: ${{ inputs.products || '' }}
          LANGUAGES: ${{ steps.languages.outputs.list }}
          MAX_FILES: ${{ inputs.max-files || '100000' }}
          ENVIRONMENT: ${{ inputs.environment || 'production' }}
          TRANSLAGENT_MAX_CONCURRENCY: "128"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL || 'professionalize-gpt-oss' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_SERVICE_NAME: translagent
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}

      # A budgeted run can legitimately spend everything on one page that does
      # not finish, so completed pages are the wrong evidence of a healthy run.
      # A pass that started is what separates slow from broken — a missing
      # content dir, a broken image or an empty binary never gets that far.
      - name: Guard against a silent no-op
        run: |
          if ! grep -q "translation pass starting" run.log; then
            echo "::error::translagent never started a translation pass"
            exit 1
          fi

      # Runs even when the job times out mid-run: batches of 10 are already
      # committed locally and must not be lost.
      - name: Push translations
        if: always()
        working-directory: site
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 10
          done
          exit 1

      # What landed on master decides what redeploys: every translated file
      # maps to its language's segment, and one Webgentics dispatch per
      # language carries exactly the touched segments, so translations reach
      # the bucket within the hour instead of waiting for a nightly sweep.
      # Diffing against origin/master deploys only what really pushed, and a
      # dispatch that fails is a warning - the same segment redeploys with the
      # next run that lands a translation in it.
      - name: Deploy the touched segments
        if: always()
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch -q origin master
          SEGMENTS=$(git diff --name-only "$BASE..origin/master" -- translated-content/ | awk -F/ '
            {
              n = split($NF, parts, ".")
              if (n < 3) next
              lang = parts[n-1]
              seg = $2
              if (seg == "conversion") {
                if ($3 ~ /\./ || $3 == "family") seg = "conversion-home"
                else seg = "conversion-" $3
              }
              print lang ":" seg
            }' | sort -u)
          if [ -z "$SEGMENTS" ]; then
            echo "no translated files landed; nothing to deploy"
            exit 0
          fi
          failed=0
          total=0
          {
            echo "## Segment deploys"
            echo
            echo "| Language | Segments | Dispatch |"
            echo "| :--- | :--- | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for lang in $(echo "$SEGMENTS" | cut -d: -f1 | sort -u); do
            list=$(echo "$SEGMENTS" | grep "^$lang:" | paste -sd, -)
            total=$(( total + 1 ))
            op="l10n-${lang}-${GITHUB_RUN_NUMBER}"
            ok=""
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/webgentics.yml/dispatches" \
                -d "{\"ref\":\"master\",\"inputs\":{\"operation_id\":\"$op\",\"operation_kind\":\"connector.deploy\",\"sha_ref\":\"master\",\"website_id\":\"products.groupdocs.cloud\",\"segments\":\"$list\"}}" \
                || echo 000)
              if [ "$code" = "204" ]; then ok=yes; break; fi
              sleep $(( attempt * 5 ))
            done
            if [ -n "$ok" ]; then
              echo "| $lang | $list | queued as \`$op\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $lang | $list | **failed ($code)** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::deploy dispatch failed for $lang (HTTP $code)"
              failed=$(( failed + 1 ))
            fi
          done
          if [ "$failed" -eq "$total" ]; then
            echo "::error::every deploy dispatch failed"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## This run"
            echo "- translated: $(grep -cE '^Translated: ' translated.txt || echo 0)"
            echo "- already current: $(grep -cE '^Up to date, skipped: ' translated.txt || echo 0)"
            echo '```'
            tail -n 20 translated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_id }}
          path: |
            run.log
            translated.txt
          retention-days: 14
