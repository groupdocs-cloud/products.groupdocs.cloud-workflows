name: Locale deploy fan-out

# Fans out one Webgentics deploy per language over every locale segment.
# The hourly translate run deploys the segments its own translations touch,
# so this is dispatch-only: the manual sweep for changes that touch every
# locale page at once, such as a theme edit. Each language's segment list is
# read from the content repo's config/_default/segments.yaml at run time, so
# this file never carries a copy that can drift. The dispatched runs succeed
# or fail individually in the Webgentics workflow's own history; this job
# only guarantees the dispatches were accepted.

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes, or empty for every language"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the segment definitions
        uses: actions/checkout@v4
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          ref: master
          token: ${{ secrets.REPO_TOKEN }}
          path: site
          sparse-checkout: config/_default/segments.yaml
          fetch-depth: 1

      - name: Dispatch one deploy per language
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.languages || '' }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml 2>/dev/null || true
          python3 - > "$RUNNER_TEMP/groups.txt" <<'PY'
          import os, yaml
          from collections import defaultdict
          spec = yaml.safe_load(open("site/config/_default/segments.yaml"))
          by = defaultdict(list)
          for name in spec:
              if ":" in name:
                  by[name.split(":", 1)[0]].append(name)
          only = {c.strip() for c in os.environ.get("ONLY", "").split(",") if c.strip()}
          for lang in sorted(by):
              if only and lang not in only:
                  continue
              print(f"{lang} {','.join(sorted(by[lang]))}")
          PY
          [ -s "$RUNNER_TEMP/groups.txt" ] || { echo "::error::no languages matched"; exit 1; }

          failed=0
          {
            echo "## Nightly locale dispatches"
            echo
            echo "| Language | Segments | Dispatch |"
            echo "| :--- | ---: | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r lang segments; do
            op="nightly-l10n-${lang}-${GITHUB_RUN_NUMBER}"
            ok=""
            for attempt in 1 2 3; do
              code=$(curl -s -o "$RUNNER_TEMP/resp.txt" -w '%{http_code}' --max-time 30 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/webgentics.yml/dispatches" \
                -d "{\"ref\":\"master\",\"inputs\":{\"operation_id\":\"$op\",\"operation_kind\":\"connector.deploy\",\"sha_ref\":\"master\",\"website_id\":\"products.groupdocs.cloud\",\"segments\":\"$segments\"}}" \
                || echo 000)
              if [ "$code" = "204" ]; then ok=yes; break; fi
              sleep $(( attempt * 5 ))
            done
            n=$(( $(echo "$segments" | tr -cd ',' | wc -c) + 1 ))
            if [ -n "$ok" ]; then
              echo "| $lang | $n | queued as \`$op\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $lang | $n | **failed ($code)** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::dispatch failed for $lang (HTTP $code): $(head -c 200 "$RUNNER_TEMP/resp.txt")"
              failed=$(( failed + 1 ))
            fi
          done < "$RUNNER_TEMP/groups.txt"
          [ "$failed" -eq 0 ]
