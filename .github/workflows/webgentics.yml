name: Webgentics
run-name: "Webgentics-Operation: ${{ inputs.operation_id }}"

# The workflow webgentics dispatches: one run per operation, its id echoed
# into the run name above. Any operation_kind but connector.deploy fails the
# run; a connector.deploy deploys the content repository at sha_ref to the
# environment the request names, production unless a dispatch says otherwise -
# which decides the baseURL, the bucket and everything else Hugo resolves per
# environment. website_id is declared for the dispatch contract and read by
# nothing here.
#
# Segments are defined in the content repository, in Hugo's own
# config/_default/segments.yaml. Hugo is the single reader: this workflow
# takes the definitions from the effective config (`hugo config`) at the
# checked-out ref, so what it resolves is exactly what the build resolves -
# there is no second copy to drift.
#
#   segments: conversion-net              one segment
#   segments: conversion-net,viewer       two segments in one run
#   segments: fr:viewer                   the viewer segment, French
#   segments:                             every segment - the whole site
#
# Each segment declares its own language, so a name identifies a slice
# completely.
#
# English is always Hugo's default content language, whichever language is
# being rendered: making the slice language the default would tell Hugo to read
# every unsuffixed file as that language and publish the English corpus under
# its prefix. English is loaded alongside the target so `x.md` resolves against
# `x.fr.md`, and the segment's own language matcher keeps it unrendered - which
# is why no step trims the output.
#
# Hugo's segments filter *rendering*, not loading, so --renderSegments alone
# leaves the whole site in memory. The path globs are therefore also translated
# into ignoreFiles, which excludes at load time and is what actually bounds
# memory. Anything a segment expresses that ignoreFiles cannot - a kind or
# output filter, excludes, a non-prefix glob - is refused rather than
# approximated, because a slice looser than intended is OOM-killed minutes in
# rather than failing fast. If Hugo ever excludes at load time, delete the
# translation and keep every definition.

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Webgentics Operation ID
        type: string
        required: true
      operation_kind:
        description: Webgentics Operation Kind
        type: choice
        options:
          - connector.deploy
        required: true
      sha_ref:
        description: Branch, tag or commit SHA of the Hugo project repository
        type: string
        required: true
      website_id:
        description: Webgentics Website ID
        type: string
        required: true
      environment:
        description: Build and deploy environment
        type: environment
        default: production
        required: true
      segments:
        description: Comma-separated segment names from the Hugo project repository
        type: string
        required: false

jobs:
  build:
    # The runner belongs to the site, not to the request, so it comes from an
    # Actions variable rather than an input - a caller never names it. Set
    # RUNS_ON at repository or environment level to move builds onto a bigger
    # or self-hosted runner. Unset, it stays on ubuntu-latest.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    env:
      NODE_ENV: ${{ inputs.environment }}
      HUGO_ENVIRONMENT: ${{ inputs.environment }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      # Ceph RGW rejects the SDK's flexible-checksum uploads (trailing CRC,
      # aws-chunked) with SignatureDoesNotMatch - seen on the gzipped section
      # sitemaps. WHEN_REQUIRED restores plain signed puts.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      CONTENT_ROOT: content/english

    steps:
      # An unhandled kind must be a red run, never a silent green.
      - name: Refuse any operation kind but connector.deploy
        if: inputs.operation_kind != 'connector.deploy'
        env:
          KIND: ${{ inputs.operation_kind }}
        run: |
          set -euo pipefail
          echo "::error::unhandled operation kind \"$KIND\": this workflow handles connector.deploy only"
          exit 1

      # `sha_ref` takes a branch, a tag or a SHA in one field - actions/checkout
      # resolves all three. fetch-depth 0 is what makes a bare SHA work at all
      # (a shallow fetch only carries branch tips), and separately it is what
      # gives each page its own sitemap lastmod instead of one shared date.
      - uses: actions/checkout@v4
        with:
          repository: groupdocs-cloud/products.groupdocs.cloud
          ref: ${{ inputs.sha_ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0

      - name: Report what was checked out
        run: |
          set -euo pipefail
          {
            echo "# Deploy &middot; \`${{ inputs.segments || 'every segment' }}\` &rarr; ${{ inputs.environment }}"
            echo
            echo "| Request | |"
            echo "| :--- | :--- |"
            echo "| Operation | \`${{ inputs.operation_id }}\` |"
            echo "| Segments | \`${{ inputs.segments || '(every segment)' }}\` |"
            echo "| Ref requested | \`${{ inputs.sha_ref }}\` |"
            echo "| Commit | [\`$(git rev-parse --short HEAD)\`](${{ github.server_url }}/groupdocs-cloud/products.groupdocs.cloud/commit/$(git rev-parse HEAD)) $(git log -1 --format=%s | cut -c1-64) |"
            echo "| Authored | $(git log -1 --format=%ad --date=format:'%Y-%m-%d %H:%M') |"
            echo
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # `hugo deploy` ships only in the withdeploy builds; the common setup
      # actions install plain extended, and the deploy then fails after the
      # whole build has run. Assert it up front instead.
      - name: Install Hugo (extended, withdeploy)
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.parse(d).tag_name.replace(/^v/,"")))')
          DEB="hugo_extended_withdeploy_${VERSION}_linux-amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$DEB" \
            "https://github.com/gohugoio/hugo/releases/download/v${VERSION}/${DEB}"
          sudo dpkg -i "$RUNNER_TEMP/$DEB"
          hugo version
          hugo deploy --help >/dev/null 2>&1 \
            || { echo "::error::installed Hugo has no deploy support"; exit 1; }

      # Empty segments means the whole site: every segment defined at the
      # checked-out commit, resolved here into the same comma-separated shape
      # a dispatch would carry. The names come from the effective config, the
      # same resolution the build below sees.
      - name: Resolve the segment list
        id: segments
        env:
          REQUESTED: ${{ inputs.segments }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            {
              echo 'segments<<SEGMENTS'
              echo "$REQUESTED"
              echo 'SEGMENTS'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hugo config --environment=${{ inputs.environment }} --format json > "$RUNNER_TEMP/effective.json"
          node - <<'NODE'
          const fs = require('fs')
          const cfg = require(`${process.env.RUNNER_TEMP}/effective.json`)
          const names = Object.keys(cfg.segments || {})
          if (!names.length) {
            console.log('::error::the effective config defines no segments')
            process.exit(1)
          }
          const broken = names.filter(n => n.includes(',') || n.includes('\n'))
          if (broken.length) {
            console.log(`::error::segment names cannot join a comma-separated list: ${broken.join(' ')}`)
            process.exit(1)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `segments=${names.join(',')}\n`)
          const note = `Resolved every segment: ${names.length} defined at this commit.`
          console.log(note)
          const summary = process.env.GITHUB_STEP_SUMMARY
          if (summary) fs.appendFileSync(summary, note + '\n\n')
          NODE

      - name: Install GNU time
        run: command -v /usr/bin/time >/dev/null || sudo apt-get install -y -qq time

      # The slicing lives in the content repo's own `npm run configure`, so a
      # build here and a build on a laptop resolve a segment identically. The
      # workflow contributes nothing to the definition.
      - name: Resolve segments into a Hugo config
        env:
          SEGMENTS: ${{ steps.segments.outputs.segments }}
        run: |
          set -euo pipefail
          if [ -z "${SEGMENTS// }" ]; then
            echo "::error::segments is empty"; exit 1
          fi
          # Segment names carry their own language, so they pass through
          # untouched - configure resolves the language, the disabled
          # languages, ignoreFiles and renderSegments from the definitions.
          export CONFIGURE_SEGMENTS="$SEGMENTS"
          export CONFIGURE_PATHS_FILE="$RUNNER_TEMP/slice-paths.txt"
          npm run configure

      # config/_default beats a root config file for any key it declares, and
      # Hugo does not warn when it wins. Assert the slice actually took effect
      # rather than trust that it did.
      - name: Verify the slice took effect
        run: |
          set -euo pipefail
          hugo config --environment=${{ inputs.environment }} --format json > "$RUNNER_TEMP/effective.json"
          node - <<'NODE'
          const fs = require('fs')
          const summary = process.env.GITHUB_STEP_SUMMARY
          const say = s => { console.log(s); if (summary) fs.appendFileSync(summary, s + '\n') }
          const want = JSON.parse(fs.readFileSync('hugo.json', 'utf8'))
          const eff = require(`${process.env.RUNNER_TEMP}/effective.json`)
          let bad = false
          const cmp = (key, expected) => {
            const got = eff[key] || []
            if (JSON.stringify([...got].sort()) !== JSON.stringify([...expected].sort())) {
              console.log(`::error::${key} was overridden by config/_default - wanted ${
                expected.length} entries, Hugo resolved ${got.length}`)
              bad = true
            }
          }
          cmp('ignorefiles', want.ignoreFiles)
          cmp('disablelanguages', want.disableLanguages)
          if (bad) process.exit(1)

          const res = want.ignoreFiles.map(r => new RegExp(r))
          const root = process.env.CONTENT_ROOT
          const selected = p => p.endsWith('.md') && !res.some(r => r.test(p))
          const walk = dir => {
            let n = 0
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = `${dir}/${e.name}`
              n += e.isDirectory() ? walk(p) : selected(p) ? 1 : 0
            }
            return n
          }
          // content/english/_index.md is the home page - a file at the root
          // rather than a directory, and no ignoreFiles prefix can exclude it,
          // so it is counted apart from the directories it would otherwise mask.
          let inDirs = 0
          let atRoot = 0
          const per = {}
          for (const d of fs.readdirSync(root, { withFileTypes: true })) {
            if (!d.isDirectory()) { if (selected(`${root}/${d.name}`)) atRoot++; continue }
            const n = walk(`${root}/${d.name}`)
            if (n) { per[d.name] = n; inDirs += n }
          }
          if (atRoot) per['(site root)'] = atRoot
          const total = inDirs + atRoot

          const paths = fs.readFileSync(`${process.env.RUNNER_TEMP}/slice-paths.txt`, 'utf8')
            .split('\n').map(l => l.trim()).filter(Boolean)
          if (paths.some(p => p !== '/') && !inDirs) {
            console.log('::error::this slice declares paths but selects no content')
            process.exit(1)
          }

          // ~160 KiB of peak RSS per page over a ~350 MiB floor, measured on
          // this runner class. Cheaper to warn than to be OOM-killed at 90%.
          const runnerMib = Math.round(Number((fs.readFileSync('/proc/meminfo', 'utf8')
            .match(/^MemTotal:\s+(\d+)/m) || [, 0])[1]) / 1024)
          const predicted = Math.round(350 + total * 160 / 1024)
          const pct = runnerMib ? Math.round(predicted * 100 / runnerMib) : 0

          say('## Slice')
          say('')
          if (total) {
            say('| Content directory | Source pages |')
            say('| :--- | ---: |')
            for (const [p, n] of Object.entries(per).sort((a, b) => b[1] - a[1]))
              say(`| \`${p}\` | ${n.toLocaleString()} |`)
            say(`| **Total** | **${total.toLocaleString()}** |`)
          } else {
            say('No content directories &mdash; site-level artifacts only.')
          }
          say('')
          say(`Renders \`${want.renderSegments.join('`, `')}\`. `
            + `Excluded at load time: ${want.ignoreFiles.length} content `
            + `directories, ${want.disableLanguages.length} languages. `
            + `Predicted peak **${predicted.toLocaleString()} MiB** of `
            + `${runnerMib.toLocaleString()} MiB (${pct}%).`)
          say('')
          say('<details><summary>Resolved Hugo configuration</summary>')
          say('')
          say('```json')
          say(JSON.stringify(want, null, 2))
          say('```')
          say('')
          say('</details>')
          say('')
          if (pct >= 80)
            console.log(`::warning::predicted peak is ${pct}% of runner memory; use narrower segments`)
          NODE

      - name: Build
        run: |
          set -euo pipefail
          # No --renderSegments: configure wrote it into hugo.json beside the
          # ignoreFiles it was derived from, so what Hugo renders and what it
          # loads come from one list and cannot disagree.
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" \
            hugo --environment=${{ inputs.environment }}
          PEAK_KB=$(awk '/Maximum resident set size/ {print $NF}' "$RUNNER_TEMP/time.txt")
          WALL=$(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' "$RUNNER_TEMP/time.txt")
          PAGES=$(find public -name '*.html' | wc -l)
          MAPS=$(find public -name 'sitemap*.xml' | wc -l)
          TOTAL_KB=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          {
            echo "## Build"
            echo
            echo "| HTML pages | Sitemaps | Peak RSS | Runner headroom used | Wall clock |"
            echo "| ---: | ---: | ---: | ---: | ---: |"
            echo "| $PAGES | $MAPS | $((PEAK_KB / 1024)) MiB | $((PEAK_KB * 100 / TOTAL_KB))% | $WALL |"
            echo
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"


      # A slice's public/ holds only its own pages, so every other object in
      # the bucket looks to Hugo like a deletion. --maxDeletes 0 is what stops
      # it acting on that; the content repo's config/_default/deployment.yaml
      # sets the same value, and the flag makes it independent of the config.
      - name: Deploy
        run: |
          set -euo pipefail
          TARGET=$(node -e '
            const t = (require(`${process.env.RUNNER_TEMP}/effective.json`).deployment || {}).targets || [];
            process.stdout.write(t.length ? t[0].url : "(no target configured)")')
          {
            echo "## Upload"
            echo
            echo "| Target | Files | Size | Deletions allowed |"
            echo "| :--- | ---: | ---: | ---: |"
            echo "| \`$TARGET\` | $(find public -type f | wc -l) | $(du -sh public | cut -f1) | 0 |"
            echo
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          hugo deploy \
            --environment=${{ inputs.environment }} \
            --maxDeletes 0

      # Purges what shipped, from the same path list the slice was built from.
      # configure.js writes those paths language-prefixed, so a `fr:viewer`
      # slice purges /fr/viewer/* and nothing else - no all-locales pattern is
      # needed here, unlike product.hugo.yml, which does not know its language.
      #
      # One wildcard URL per POST as {"website": "<url>"} is the shape the
      # invalidation API takes.
      #
      # A failed purge leaves the CDN serving the previous page for up to its
      # 30-day max-age, which is why it fails the job even though the upload
      # above succeeded. Shipped-but-not-purged is a state someone has to act
      # on, not one to find out about a month later. The table is built first
      # and rendered after, because a counter incremented inside a pipeline is
      # lost with the subshell it ran in.
      - name: Invalidate cache
        env:
          API_ENDPOINT: ${{ secrets.CACHE_INVALIDATION_API_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${API_ENDPOINT:-}" ]; then
            echo "::error::CACHE_INVALIDATION_API_ENDPOINT is not set"
            exit 1
          fi
          BASE_URL=$(node -e '
            const base = require(`${process.env.RUNNER_TEMP}/effective.json`).baseurl;
            process.stdout.write(base.replace(/\/$/, ""))')

          TABLE="$RUNNER_TEMP/purge.md"
          : > "$TABLE"
          failed=0
          total=0
          while read -r path; do
            [ -n "$path" ] || continue
            total=$((total + 1))
            url="$BASE_URL$path"
            code=$(curl --silent --show-error --output /dev/null \
                        --retry 3 --retry-delay 2 --max-time 30 \
                        --write-out '%{http_code}' \
                        -d "{\"website\":\"$url\"}" \
                        -H "Content-Type: application/json" \
                        -X POST "$API_ENDPOINT") || code=000
            case "$code" in
              2*) printf '| `%s` | purged (%s) |\n' "$url" "$code" >> "$TABLE" ;;
              *)  printf '| `%s` | **failed (%s)** |\n' "$url" "$code" >> "$TABLE"
                  echo "::error::cache purge failed for $url (HTTP $code)"
                  failed=$((failed + 1)) ;;
            esac
          done < "$RUNNER_TEMP/slice-paths.txt"

          {
            echo "## Cache invalidation"
            echo
            echo "| Path | Status |"
            echo "| :--- | :--- |"
            cat "$TABLE"
            echo
            echo "${failed} of ${total} failed."
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          [ "$failed" -eq 0 ]
